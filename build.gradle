plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.1'
	id 'checkstyle'
	id 'jacoco'
}

group = 'com.ecommerce'
version = '0.0.1-SNAPSHOT'
description = 'Centralized Spring Cloud Config Server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', '2025.0.0')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-config-server'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Keep transitive dependencies patched for known CVEs even before the OWASP
// scanner is re-enabled in CI.
configurations.configureEach {
	resolutionStrategy {
		eachDependency { details ->
			if (details.requested.group == 'org.apache.commons'
					&& details.requested.name == 'commons-compress') {
				details.useVersion '1.26.0'
				details.because 'CVE-2024-25710 / CVE-2024-26308'
			}
			if (details.requested.group == 'org.apache.commons'
					&& details.requested.name == 'commons-lang3') {
				details.useVersion '3.18.0'
				details.because 'CVE-2025-48924'
			}
			if (details.requested.group == 'org.eclipse.jgit') {
				details.useVersion '7.3.0.202506031305-r'
				details.because 'CVE-2025-4949'
			}
			if (details.requested.group == 'ch.qos.logback') {
				details.useVersion '1.5.19'
				details.because 'CVE-2025-11226'
			}
		}
	}
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

bootJar {
	archiveFileName = 'config-server.jar'
}

// Shared, vendored, offline code-quality config (Spotless + Checkstyle + JaCoCo).
apply from: "$rootDir/gradle/quality.gradle"
